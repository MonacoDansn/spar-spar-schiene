name: Android APK bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen (debug-signiert, direkt installierbar)
        working-directory: android
        run: gradle assembleDebug

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SparSparSchiene.apk

      - name: Als Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes || true
          git push --delete origin apk-latest || true
          gh release create apk-latest SparSparSchiene.apk \
            --title "Spar Spar Schiene - Android App" \
            --notes "WebView-App. Beim ersten Start Server-URL eingeben (Render-URL oder http://<PC-IP>:8325 im Heim-WLAN). Installation: APK herunterladen, 'Unbekannte Quellen' erlauben, installieren."

      - uses: actions/upload-artifact@v4
        with:
          name: SparSparSchiene-apk
          path: SparSparSchiene.apk
