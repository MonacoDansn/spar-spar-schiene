name: Android APK bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stationsdatenbank generieren (stations.json ist gitignored)
        run: python -c "import stations; print(len(stations.load_stations()), 'Stationen')"

      - name: APKs bauen (debug-signiert, direkt installierbar)
        working-directory: android
        run: gradle assembleDebug

      - name: APKs umbenennen
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SparSparSchiene.apk
          cp android/applocal/build/outputs/apk/debug/applocal-debug.apk SparSparSchieneLokal.apk

      - name: Als Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes || true
          git push --delete origin apk-latest || true
          gh release create apk-latest SparSparSchiene.apk SparSparSchieneLokal.apk \
            --title "Spar Spar Schiene - Android Apps" \
            --notes "SparSparSchiene.apk: WebView-App fuer den eigenen Server (Render-URL oder http://<PC-IP>:8325). SparSparSchieneLokal.apk (experimentell): laeuft komplett lokal am Handy, kein Server und keine Anmeldung noetig. Installation: APK herunterladen, 'Unbekannte Quellen' erlauben, installieren."

      - uses: actions/upload-artifact@v4
        with:
          name: SparSparSchiene-apks
          path: |
            SparSparSchiene.apk
            SparSparSchieneLokal.apk
