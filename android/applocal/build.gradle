plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Eine Quelle fuer beide Apps: Python-Code, Oberflaeche und Stationsdaten
// werden beim Bauen aus dem Repo-Root hierher synchronisiert.
tasks.register('syncSparPython', Sync) {
    from("${rootDir}/../") {
        include 'server.py', 'scanner.py', 'oebb.py', 'stations.py'
    }
    into layout.buildDirectory.dir('spar-python')
}

tasks.register('syncSparAssets', Sync) {
    from("${rootDir}/../public") { into 'public' }
    from("${rootDir}/../data/stations.json") { into 'data' }
    into layout.buildDirectory.dir('spar-assets')
}

android {
    namespace 'at.sparsparschiene.local'
    compileSdk 34

    defaultConfig {
        applicationId "at.sparsparschiene.local"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-experimental"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            python.srcDirs = ["${buildDir}/spar-python"]
            assets.srcDirs += ["${buildDir}/spar-assets"]
        }
    }
}

chaquopy {
    defaultConfig {
        // CI (ubuntu-latest) stellt python3 bereit
        buildPython "python3"
    }
}

preBuild.dependsOn 'syncSparPython', 'syncSparAssets'
