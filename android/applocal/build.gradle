plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Eine Quelle fuer beide Apps: Python-Code, Oberflaeche und Stationsdaten werden
// beim Bauen aus dem Repo-Root synchronisiert. Bewusst zur Konfigurationszeit,
// damit die Verzeichnisse existieren, bevor Chaquopy/AGP sie einlesen.
def sparRoot = "${rootDir}/.."
def sparPython = layout.buildDirectory.dir('spar-python').get().asFile
def sparAssets = layout.buildDirectory.dir('spar-assets').get().asFile
copy {
    from(sparRoot) {
        include 'server.py', 'scanner.py', 'oebb.py', 'stations.py'
    }
    into sparPython
}
copy {
    from("${sparRoot}/public") { into 'public' }
    from("${sparRoot}/data/stations.json") { into 'data' }
    into sparAssets
}

android {
    namespace 'at.sparsparschiene.local'
    compileSdk 34

    defaultConfig {
        applicationId "at.sparsparschiene.local"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-experimental"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDirs += [sparAssets]
        }
    }
}

chaquopy {
    defaultConfig {
        // CI (ubuntu-latest) stellt python3 bereit
        buildPython("python3")
    }
    sourceSets.getByName("main") {
        srcDirs = [sparPython.absolutePath]
    }
}
