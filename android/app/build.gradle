plugins {
    id 'com.android.application'
}

android {
    namespace 'at.sparsparschiene.app'
    compileSdk 34

    defaultConfig {
        applicationId "at.sparsparschiene.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
